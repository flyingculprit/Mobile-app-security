<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>APK Security Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <div class="card">
            <h1>APK Security Scanner</h1>
            <p class="subtitle">Static Android APK security analysis</p>

            <form id="scanForm" enctype="multipart/form-data">
                <label class="upload-box">
                    <input type="file" name="apk" id="apkInput" accept=".apk" required>
                    <div class="upload-content">
                        <div class="upload-icon">📁</div>
                        <p id="fileText">Click to upload APK</p>
                        <span>Only .apk files supported</span>
                    </div>
                </label>
                <button type="submit" class="scan-btn" id="submitBtn">Scan APK</button>
            </form>

            <div id="uploadStatus">
                <div class="upload-progress-container">
                    <div id="uploadBarFill"></div>
                </div>
                <p id="uploadStatusText">Uploading: 0%</p>
            </div>
        </div>
    </div>

    <div id="loadingScreen">
        <div class="loader"></div>
        <p id="scanText">Scanning APK...</p>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <span id="percent">0%</span>
    </div>

    <script>
        const form = document.getElementById("scanForm");
        const fileInput = document.getElementById("apkInput");
        const fileText = document.getElementById("fileText");
        const submitBtn = document.getElementById("submitBtn");
        const uploadStatus = document.getElementById("uploadStatus");
        const uploadBarFill = document.getElementById("uploadBarFill");
        const uploadStatusText = document.getElementById("uploadStatusText");

        const loadingScreen = document.getElementById("loadingScreen");
        const progressBar = document.getElementById("progress");
        const percentText = document.getElementById("percent");

        let scanProgress = 0;
        let serverResponse = "";

        fileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;
            if (!file.name.endsWith(".apk")) {
                alert("Only APK files allowed");
                this.value = "";
                return;
            }
            fileText.innerText = file.name;
        });

        function startScanAnimation() {
            loadingScreen.style.display = "flex";
            const interval = setInterval(() => {
                if (scanProgress < 90) {
                    scanProgress += 1;
                    progressBar.style.width = scanProgress + "%";
                    percentText.innerText = scanProgress + "%";
                }
                if (serverResponse !== "" && scanProgress >= 90) {
                    clearInterval(interval);
                    finishScan();
                }
            }, 100);
        }

        function finishScan() {
            const finishInterval = setInterval(() => {
                if (scanProgress < 100) {
                    scanProgress++;
                    progressBar.style.width = scanProgress + "%";
                    percentText.innerText = scanProgress + "%";
                } else {
                    clearInterval(finishInterval);
                    setTimeout(() => {
                        document.open();
                        document.write(serverResponse);
                        document.close();
                    }, 400);
                }
            }, 30);
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            
            submitBtn.style.display = "none";
            uploadStatus.style.display = "block";

            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            // REAL-TIME UPLOAD TRACKING
            xhr.upload.addEventListener("progress", (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    uploadBarFill.style.width = percent + "%";
                    uploadStatusText.innerText = `Uploading: ${percent}%`;
                    
                    if(percent === 100) {
                        uploadStatusText.innerText = "Upload Done! Starting Scan...";
                    }
                }
            });

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    serverResponse = xhr.responseText;
                    
                    // Delay slightly after 100% so user sees "Done"
                    setTimeout(() => {
                        uploadStatus.style.display = "none";
                        startScanAnimation();
                    }, 1000);
                }
            };

            xhr.open("POST", "/", true);
            xhr.send(formData);
        });
    </script>
</body>
</html>
